<div class="adoption-container">
  <div class="adoption-header">
    <h1>Adopt a Pet</h1>
    <p>Fill out the form below to start your adoption journey.</p>
  </div>

  <div class="form-section">
    <form action="orderplaced.html" class="adoption-form">

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" placeholder="Enter your name" required id="fullname">
      </div>

      <div class="form-group" >
        <label for="email">Email</label>
        <input type="email" placeholder="Enter your email" required id="email">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" placeholder="Enter your phone" required id="phone">
      </div>

      <div class="form-group">
        <label for="select">Select Pet</label>
        <select required id="select">
          <option value="">Choose a pet</option>
          <option>Buddy</option>
          <option>Max</option>
          <option>Luna</option>
          <option>Oliver</option>
          <option>Rocky</option>
          <option>Milo</option>
          <option>coon</option>
          <option>Ragdoll</option>
          <option>Sphynx</option>
          <option>Tiger</option>
          <option>hubby</option>
          <option>chiki</option>
          <option>Yellow</option>
          <option>Love</option>
        </select>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea placeholder="Enter your address" required id="address"></textarea>
      </div>

      <div class="form-group">
        <label for="textarea">Why do you want to adopt?</label>
        <textarea placeholder="Write your reason..." required id="textarea"></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>

    </form>
</div>
</div>
